<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled page</title>
    <style>
        body {
            background: #12151b;
            color: #eae7df;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 36px;
            padding: 20px;
        }

        h1 {
            color: #eae7df;
            font-size: 48px;
        }

        li {
            margin-bottom: 10px;
        }
        .warning {
            color: red;
            font-weight: bold;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #db7878;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>Styled Heading</h1>
    <p>This is a styled paragraph.</p>
    <ul>
        <li>Lap 1: 6:02</li>
        <li>Lap 2: 5:45</li>
        <li>Lap 3: 5:30</li>
    </ul>
    <p class="warning">Warning: This is a warning message!</p>
    <div class="card">
        <h2>Card Title</h2>
        <p>This is some content inside a card.</p>
    </div>
    <div class="card">
        <h2>Card Title 2</h2>
        <p>This is some content inside a card.</p>
    </div>
    
</body>

</html>
